# Local/server orchestration: the FastAPI web service (built from the Dockerfile, configured through .env)
# and a Redis instance used as the match-result cache.
services:
  web:
    build: .
    ports:
      - "80:8000"
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
# Author: Joonyoung Ki
#
# Local/server orchestration: the FastAPI web service (built from the Dockerfile, configured through .env),
# a Redis instance used as the match-result cache, and Caddy. Caddy listens on 443 with a Cloudflare
# Origin Certificate, redirects port 80 to HTTPS, and reverse-proxies to web:8000 on the compose network.
# The certificate and key are gitignored; see deploy/certs/README.txt. Create those files before `up`,
# or Docker will create directories in their place and Caddy will not start.
services:
  web:
    build: .
    # A SIGSEGV (exit 139) previously left this container stopped, and the site
    # stayed down because nothing restarted it. unless-stopped brings it back
    # unless an operator stopped it on purpose.
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overridable from the project .env. uvloop is the default. asyncio disables it.
      UVICORN_LOOP: ${UVICORN_LOOP:-uvloop}
      PYTHONUNBUFFERED: "1"
    depends_on:
      - redis

  redis:
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs/origin.pem:/etc/caddy/certs/origin.pem:ro
      - ./deploy/certs/origin-key.pem:/etc/caddy/certs/origin-key.pem:ro
    depends_on:
      - web

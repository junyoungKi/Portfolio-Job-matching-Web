<!doctype html>
<!--
  Author: Joonyoung Ki

  HTML entry of the Vite React app. It sets the document metadata, applies the saved light/dark theme
  with an inline script before first paint (avoiding a flash of the wrong theme) and mounts the app into #root.
-->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#3b5bdb" />
    <title>Smart Job AI</title>
    <!-- Apply the stored theme (or the OS preference) immediately; mirrors the logic in src/lib/theme.ts. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('theme')
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
